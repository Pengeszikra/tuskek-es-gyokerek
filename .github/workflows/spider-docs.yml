# Regenerates dist/spider-docs.html from the current Spider Paint: its own generator
# (scripts/docs-page.mjs) renders help/*.md into templates/spider-docs.html.
name: spider-docs
on:
  workflow_dispatch:
  repository_dispatch:
    types: [spider-docs]
  schedule:
    - cron: '17 4 * * *'
  push:
    paths: ['templates/spider-docs.html', '.github/workflows/spider-docs.yml']
permissions:
  contents: write
jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: Pengeszikra/Spider-Paint
          ref: master
          path: .spider-paint
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node .spider-paint/scripts/docs-page.mjs --template templates/spider-docs.html --out dist/spider-docs.html
      - name: Commit if the docs changed
        run: |
          git diff --quiet dist/spider-docs.html && exit 0
          git config user.name 'github-actions[bot]'
          git config user.email '41898332+github-actions[bot]@users.noreply.github.com'
          git add dist/spider-docs.html
          git commit -m "spider-docs: regenerated from Spider Paint $(git -C .spider-paint rev-parse --short HEAD)"
          git push
